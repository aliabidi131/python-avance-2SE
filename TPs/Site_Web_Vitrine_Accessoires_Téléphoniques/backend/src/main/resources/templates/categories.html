<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories - PhoneLux</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: var(--text); }
        header { padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo { font-size: 1.2rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        nav ul { display: flex; list-style: none; gap: 1.5rem; }
        nav a { color: var(--text); text-decoration: none; font-size: 0.9rem; }
        .container { padding: 4rem 5%; }
        h1 { font-size: 3rem; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .card { background: var(--card-bg); border-radius: 15px; padding: 2rem; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); }
        .card-icon { font-size: 3rem; margin-bottom: 1rem; color: var(--primary); opacity: 0.8; }
        .card-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .card-count { font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">PHONELUX</a>
    <nav><ul><li><a href="/">Accueil</a></li><li><a href="/produits">Produits</a></li><li><a href="/categories">Catégories</a></li><li><a href="/marques">Marques</a></li></ul></nav>
</header>

<div class="container">
    <h1>Collections</h1>
    <div class="grid">
        <div th:each="c : ${categories}" class="card">
            <div class="card-icon">📂</div>
            <h3 class="card-title" th:text="${c.nom}">Nom Catégorie</h3>
            <p th:text="${c.description}" style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem;">Description...</p>
            <div class="card-count" th:text="${(c.accessoires != null ? c.accessoires.size() : 0) + ' articles'}">12 articles</div>
        </div>
    </div>
</div>

</body>
</html>
