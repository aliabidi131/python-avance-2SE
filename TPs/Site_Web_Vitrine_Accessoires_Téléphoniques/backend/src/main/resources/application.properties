# configuration serveur
server.port=8082

# configuration base de donnees postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/accessoiresdb
spring.datasource.username=postgres
spring.datasource.password=26818018

# configuration jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# configuration h2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# configuration thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# configuration redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# eviter les erreurs si redis n'est pas la (optionnel)
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration